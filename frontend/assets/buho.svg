<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" id="buho-svg">
  <!-- Minimalist Green Owl Logo - Utemito FCI-UTM -->
  <defs>
    <linearGradient id="owlGreenGrad" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15b857"/>
      <stop offset="55%" stop-color="#00983d"/>
      <stop offset="100%" stop-color="#006529"/>
    </linearGradient>
  </defs>

  <!-- Birrete minimalista superior -->
  <path d="M32 6L50 13.5L32 21L14 13.5L32 6Z" fill="url(#owlGreenGrad)"/>
  <path d="M47 15V23.5" stroke="#00983d" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="47" cy="24.5" r="2" fill="#15b857"/>

  <!-- Contorno minimalista de cabeza/orejas y cuerpo del buho -->
  <path d="M16 18L21 22.5C24.2 20.8 28 20 32 20C36 20 39.8 20.8 43 22.5L48 18L46.5 27.5C49.5 31.2 51 35.8 51 41C51 50.5 42.8 57 32 57C21.2 57 13 50.5 13 41C13 35.8 14.5 31.2 17.5 27.5L16 18Z"

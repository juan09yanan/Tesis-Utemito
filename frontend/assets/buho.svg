  <circle cx="25.7" cy="32.8" r="1.1" fill="#ffffff"/>
  <circle cx="40.7" cy="32.8" r="1.1" fill="#ffffff"/>

  <!-- Pico geometrico -->
  <path d="M29.2 39.5L32 44.2L34.8 39.5H29.2Z" fill="#00983d"/>

  <!-- Alas/pecho minimalistas en forma de libro abierto -->

  <circle cx="24.5" cy="34" r="6.8" stroke="url(#owlGreenGrad)" stroke-width="3" fill="#ffffff"/>
  <circle cx="39.5" cy="34" r="6.8" stroke="url(#owlGreenGrad)" stroke-width="3" fill="#ffffff"/>

